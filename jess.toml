manifest_version = 1

[package]
id = "org.dreamweave.jessql"
version = "0.1.6"
jess_api = "1"
include = ["src", "bench", "tests", "README.md"]
tests = ["tests/run.jsl", "tests/semantics.jsl", "tests/style.jsl"]

[modules]
"@jessql" = "src/init.jsl"
"@jessql/lexer" = "src/lexer.jsl"
"@jessql/parser" = "src/parser.jsl"
"@jessql/engine" = "src/engine.jsl"

[[layer]]
id = "jessql.core"
exports = ["@jessql", "@jessql/lexer", "@jessql/parser", "@jessql/engine"]
