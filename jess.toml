manifest_version = 1

[package]
id = "org.dreamweave.jessql"
version = "0.2.0"
jess_api = "1"
include = ["src", "bench", "tests", "scripts", "docs", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]
tests = ["tests/run.jsl", "tests/semantics.jsl", "tests/style.jsl", "tests/storage.jsl", "tests/paged.jsl", "tests/hybrid.jsl", "tests/secondary.jsl", "tests/segments.jsl", "tests/delta.jsl", "tests/tiers.jsl", "tests/durability.jsl", "tests/positional.jsl", "tests/managed.jsl", "tests/compaction.jsl", "tests/hot-budget.jsl", "tests/group-commit.jsl", "tests/maintainability.jsl", "tests/publication.jsl", "tests/verification.jsl", "tests/observability.jsl", "tests/backup.jsl", "tests/app-experience.jsl"]

[modules]
"@jessql" = "src/init.jsl"
"@jessql/lexer" = "src/lexer.jsl"
"@jessql/parser" = "src/parser.jsl"
"@jessql/engine" = "src/engine.jsl"
"@jessql/storage" = "src/storage.jsl"
"@jessql/ordered" = "src/ordered.jsl"
"@jessql/packed" = "src/packed.jsl"
"@jessql/paged" = "src/paged.jsl"
"@jessql/hybrid" = "src/hybrid.jsl"
"@jessql/segments" = "src/segments.jsl"
"@jessql/delta" = "src/delta.jsl"
"@jessql/tiers" = "src/tiers.jsl"
"@jessql/managed" = "src/managed.jsl"
"@jessql/managed_manifest" = "src/managed_manifest.jsl"
"@jessql/managed_policy" = "src/managed_policy.jsl"
"@jessql/managed_publication" = "src/managed_publication.jsl"
"@jessql/managed_verification" = "src/managed_verification.jsl"
"@jessql/managed_backup" = "src/managed_backup.jsl"
"@jessql/managed_observability" = "src/managed_observability.jsl"
"@jessql/secondary" = "src/secondary.jsl"
"@jessql/compactsecondary" = "src/compactsecondary.jsl"
"@jessql/mutations" = "src/mutations.jsl"

[[layer]]
id = "jessql.core"
exports = ["@jessql", "@jessql/lexer", "@jessql/parser", "@jessql/engine", "@jessql/storage", "@jessql/ordered", "@jessql/packed", "@jessql/paged", "@jessql/hybrid", "@jessql/segments", "@jessql/delta", "@jessql/tiers", "@jessql/managed", "@jessql/managed_manifest", "@jessql/managed_policy", "@jessql/managed_publication", "@jessql/managed_verification", "@jessql/managed_backup", "@jessql/managed_observability", "@jessql/secondary", "@jessql/compactsecondary", "@jessql/mutations"]
