manifest_version = 1

[package]
id = "org.dreamweave.jessql"
version = "0.1.6"
jess_api = "1"
include = ["src", "bench", "tests", "docs", "README.md"]
tests = ["tests/run.jsl", "tests/semantics.jsl", "tests/style.jsl", "tests/storage.jsl", "tests/paged.jsl", "tests/hybrid.jsl"]

[modules]
"@jessql" = "src/init.jsl"
"@jessql/lexer" = "src/lexer.jsl"
"@jessql/parser" = "src/parser.jsl"
"@jessql/engine" = "src/engine.jsl"
"@jessql/storage" = "src/storage.jsl"
"@jessql/ordered" = "src/ordered.jsl"
"@jessql/packed" = "src/packed.jsl"
"@jessql/paged" = "src/paged.jsl"
"@jessql/hybrid" = "src/hybrid.jsl"
"@jessql/secondary" = "src/secondary.jsl"
"@jessql/mutations" = "src/mutations.jsl"

[[layer]]
id = "jessql.core"
exports = ["@jessql", "@jessql/lexer", "@jessql/parser", "@jessql/engine", "@jessql/storage", "@jessql/ordered", "@jessql/packed", "@jessql/paged", "@jessql/hybrid", "@jessql/secondary", "@jessql/mutations"]
