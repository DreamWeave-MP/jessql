# JessQL as a DreamWeave project: a Jess package. `jess` names the Package Source it
# publishes, the jess.toml at the repository root, and each release tag `jessql-<version>` is one
# version of the package, packed by the Mod Template from that tag; every push packs a
# development build.
id = "6b0fec20-c982-440d-87a4-15aa83a3c680"
slug = "jessql"
type = "library"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.jessql"

[[releases]]
version = "0.1.6"
date = 2026-10-21
summary = "First release published as a DreamWeave project."
